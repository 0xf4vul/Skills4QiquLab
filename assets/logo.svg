<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Qiqu.Lab 奇趣实验室</title>
  <desc id="desc">高清矢量版 Qiqu.Lab 奇趣实验室 Logo，基于原始品牌图稿重制。</desc>
  <defs>
    <linearGradient id="cnYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF45A"/><stop offset="0.55" stop-color="#FFD52E"/><stop offset="1" stop-color="#FFB91F"/>
    </linearGradient>
    <linearGradient id="cnBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E7FF"/><stop offset="0.52" stop-color="#24BCEB"/><stop offset="1" stop-color="#0797E2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FEFF"/><stop offset="0.45" stop-color="#B8F1FF"/><stop offset="1" stop-color="#55B9F2"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="10" flood-color="#071B4D" flood-opacity=".30"/>
    </filter>
    <style>
      .ink{stroke:#071B4D;stroke-width:18;stroke-linejoin:round;stroke-linecap:round;paint-order:stroke fill}
      .thin{stroke:#071B4D;stroke-width:9;stroke-linejoin:round;stroke-linecap:round}
      .cn{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",sans-serif;font-weight:900}
      .en{font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;font-weight:900}
    </style>
  </defs>

  <!-- playful confetti -->
  <g class="thin">
    <path d="M182 176l38-26 28 42-38 27z" fill="#FF9B69"/>
    <path d="M335 118l38-27 35 42-38 28z" fill="#7EDBF6"/>
    <path d="M1260 126l18-43 21 42-20 42z" fill="#FFD542"/>
    <path d="M1394 155q20-42 40 0t40 0" fill="none" stroke="#3DB7F0" stroke-width="15"/>
    <path d="M1230 90l13 29 32 4-24 20 8 32-29-17-29 17 8-32-24-20 32-4z" fill="#FFB840"/>
    <path d="M252 246l13 29 31 12-31 12-13 30-13-30-31-12 31-12z" fill="#FFE14A"/>
    <path d="M1334 330l11 26 28 11-28 11-11 27-11-27-28-11 28-11z" fill="#FF9D68"/>
    <circle cx="151" cy="297" r="14" fill="#62C9F2"/>
    <circle cx="1471" cy="286" r="12" fill="#78DCE8"/>
    <circle cx="1376" cy="651" r="13" fill="#FFD642"/>
  </g>

  <!-- laboratory glassware -->
  <g class="thin" filter="url(#softShadow)">
    <path d="M111 383h110l-20 169q-5 40-35 55h0q-30-15-35-55z" fill="url(#glass)"/>
    <path d="M120 438h92" fill="none" stroke="#36B8ED" stroke-width="12"/>
    <path d="M142 498q22 20 45 0t34 0" fill="none" stroke="#39AEEB" stroke-width="9"/>
    <circle cx="147" cy="470" r="8" fill="#FFD443" stroke="none"/>
    <circle cx="184" cy="527" r="9" fill="#FF8E68" stroke="none"/>
    <path d="M1388 384h100l-19 171q-5 37-31 53-26-16-31-53z" fill="#F9FDFF"/>
    <path d="M1391 445h94" fill="none" stroke="#FFAC68" stroke-width="12"/>
    <path d="M1407 503q20 18 40 0t36 0" fill="none" stroke="#FF8E68" stroke-width="9"/>
  </g>

  <!-- chef hat -->
  <g class="thin" filter="url(#softShadow)">
    <path d="M675 191q-24-31 4-58 23-23 57-7 8-48 53-48t54 48q34-17 58 7 27 27 4 58z" fill="#fff"/>
    <path d="M695 191h169l-17 63H712z" fill="#fff"/>
    <path d="M720 191h112" stroke="#5BD5F4" stroke-width="9"/>
  </g>

  <!-- main Chinese mark -->
  <g filter="url(#softShadow)" class="cn" text-anchor="middle">
    <text x="355" y="414" font-size="218" class="ink" fill="url(#cnYellow)">奇</text>
    <text x="555" y="414" font-size="218" class="ink" fill="url(#cnYellow)">趣</text>
    <text x="765" y="414" font-size="218" class="ink" fill="url(#cnBlue)">实</text>
    <text x="978" y="414" font-size="218" class="ink" fill="url(#cnBlue)">验</text>
    <text x="1192" y="414" font-size="218" class="ink" fill="url(#cnBlue)">室</text>
  </g>

  <!-- small face accent -->
  <g class="thin">
    <circle cx="1094" cy="251" r="34" fill="#fff"/>
    <circle cx="1110" cy="251" r="5" fill="#071B4D" stroke="none"/>
    <path d="M1135 250q17-20 31 0" fill="none" stroke-width="7"/>
    <circle cx="1080" cy="279" r="7" fill="#FF8D91" stroke="none"/>
    <circle cx="1138" cy="279" r="7" fill="#FF8D91" stroke="none"/>
  </g>

  <!-- Qiqu.Lab wordmark -->
  <g class="en" text-anchor="middle" filter="url(#softShadow)">
    <text x="800" y="626" font-size="154" class="ink" fill="#fff" stroke-width="20">Qiqu.Lab</text>
  </g>

  <!-- candy / pastry accents -->
  <g class="thin">
    <path d="M1170 574l75-33 78 25-25 72-107-6z" fill="#FFB1B9"/>
    <path d="M1203 584q45-28 90 0l-13 35h-92z" fill="#FFE36C"/>
    <circle cx="1277" cy="563" r="24" fill="#B96D43"/>
    <circle cx="1310" cy="588" r="22" fill="#FF91A6"/>
    <path d="M1309 466q18-29 37 0t38 0" fill="none" stroke="#FF8E53" stroke-width="12"/>
    <path d="M1322 467v-40" fill="none" stroke="#FF8E53" stroke-width="12"/>
    <path d="M1407 447q26-34 48 0t43 0" fill="none" stroke="#4AADEB" stroke-width="13"/>
  </g>

  <!-- lower confetti -->
  <g class="thin">
    <path d="M355 690l32-20 25 31-32 21z" fill="#67CFF1"/>
    <path d="M518 716l13-35 35 13-14 35z" fill="#FFD83D"/>
    <path d="M827 698l14-34 38 15-14 34z" fill="#73DCC4"/>
    <path d="M1028 720q22-31 44 0t43 0" fill="none" stroke="#FF9A63" stroke-width="11"/>
  </g>
</svg>