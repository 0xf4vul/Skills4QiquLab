<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
<rect width="1400" height="980" fill="#ffffff"/>
<text x="70" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#172033">Skills4QiquLab — Repository Architecture</text>
<text x="70" y="112" font-family="Arial,sans-serif" font-size="20" fill="#536176">Skill 方法论 → Case 完整项目 → 模板 → 示例 → Evaluation → 迭代</text>
<rect x="70" y="155" width="1260" height="100" rx="16" fill="#eef5ff" stroke="#b8cff5"/>
<text x="100" y="195" font-family="monospace" font-size="25" fill="#173b70">Skills4QiquLab/</text>
<text x="100" y="230" font-family="monospace" font-size="19" fill="#43546b">README.md   LICENSE   skills.md</text>
<rect x="70" y="285" width="590" height="570" rx="16" fill="#f3f7ff" stroke="#b8cff5"/>
<text x="100" y="325" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#1769aa">skills/ — Core Skills</text>
<text x="100" y="355" font-family="Arial,sans-serif" font-size="17" fill="#536176">方法论 / 规则 / 边界 / 通用评测</text>
<text x="110" y="400" font-family="monospace" font-size="18" fill="#26364a">├── prompt-compression.md</text>
<text x="110" y="435" font-family="monospace" font-size="18" fill="#26364a">├── prompt-optimization.md</text>
<text x="110" y="470" font-family="monospace" font-size="18" fill="#26364a">├── prompt-reverse-engineering.md</text>
<text x="110" y="505" font-family="monospace" font-size="18" fill="#26364a">├── video-prompt-compression.md</text>
<text x="110" y="540" font-family="monospace" font-size="18" fill="#26364a">├── video-prompt-optimization.md</text>
<text x="110" y="575" font-family="monospace" font-size="18" fill="#26364a">├── web-research.md</text>
<text x="110" y="610" font-family="monospace" font-size="18" fill="#26364a">├── x-research.md</text>
<text x="110" y="645" font-family="monospace" font-size="18" fill="#26364a">└── skill-builder.md</text>
<text x="110" y="700" font-family="Arial,sans-serif" font-size="18" fill="#536176">保持抽象，不承载某个 Case 的具体实例。</text>
<rect x="690" y="285" width="640" height="180" rx="16" fill="#f7f2ff" stroke="#cdb8f5"/>
<text x="720" y="325" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#7040b8">templates/ — Global Templates</text>
<text x="720" y="365" font-family="monospace" font-size="19" fill="#26364a">└── skill-template.md</text>
<text x="720" y="405" font-family="Arial,sans-serif" font-size="17" fill="#536176">全仓库通用的 Skill 创建模板。</text>
<rect x="690" y="495" width="640" height="360" rx="16" fill="#effaf4" stroke="#9fd5b6"/>
<text x="720" y="535" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#16834b">cases/ — Complete Skill Projects</text>
<text x="720" y="575" font-family="monospace" font-size="19" fill="#26364a">└── video-prompt-compression/</text>
<text x="750" y="610" font-family="monospace" font-size="18" fill="#26364a">├── README.md</text>
<text x="750" y="640" font-family="monospace" font-size="18" fill="#26364a">├── SKILL.md</text>
<text x="750" y="670" font-family="monospace" font-size="18" fill="#26364a">├── templates/</text>
<text x="750" y="700" font-family="monospace" font-size="18" fill="#26364a">├── examples/</text>
<text x="750" y="730" font-family="monospace" font-size="18" fill="#26364a">├── evaluation/</text>
<text x="750" y="760" font-family="monospace" font-size="18" fill="#26364a">└── assets/svg/</text>
<text x="750" y="810" font-family="Arial,sans-serif" font-size="17" fill="#536176">每个成熟 Skill 都成为一个可独立维护的项目单元。</text>
<rect x="70" y="890" width="1260" height="55" rx="12" fill="#172033"/>
<text x="700" y="925" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#ffffff">发现 → 方法论 → Case → 模板 → 示例 → Evaluation → 迭代</text>
